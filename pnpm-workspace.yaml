packages:
  - apps/*
  - packages/**
  - tooling/*

allowBuilds:
  "@sentry/cli": true
  "@swc/core": false
  esbuild: false
  msw: false
  sharp: false
  supabase: true
  unrs-resolver: false

catalog:
  "@eslint/js": 10.0.1
  "@marsidev/react-turnstile": 1.5.2
  "@next/bundle-analyzer": 16.3.3
  "@next/eslint-plugin-next": 16.3.3
  "@react-email/components": 1.0.12
  "@sentry/nextjs": 10.55.0
  "@stripe/react-stripe-js": 6.1.0
  "@stripe/stripe-js": 9.2.0
  "@supabase/supabase-js": 2.106.2
  "@tailwindcss/postcss": 4.3.0
  "@tanstack/react-query": 5.100.14
  "@types/eslint": 9.6.1
  "@types/node": 25.6.0
  "@types/nodemailer": 8.0.0
  "@types/react": 19.2.14
  "@types/react-dom": 19.2.3
  eslint: 10.4.0
  eslint-config-next: 16.2.6
  eslint-config-turbo: 2.9.16
  i18next: 26.3.0
  i18next-browser-languagedetector: 8.2.1
  i18next-resources-to-backend: 1.2.1
  lucide-react: 1.17.0
  next: 16.3.3
  nodemailer: 8.0.9
  pino: 10.3.1
  react: 19.2.6
  react-dom: 19.2.6
  react-hook-form: 7.76.1
  react-i18next: 17.0.8
  stripe: 21.0.1
  supabase: 2.84.2
  tailwindcss: 4.3.0
  tsup: 8.5.1
  tw-animate-css: 1.4.0
  zod: 4.3.6

  next-intl: ^4.8.3
  next-runtime-env: 3.3.0

minimumReleaseAgeExclude:
  - '@next/bundle-analyzer@16.3.3'
  - '@next/env@16.3.3'
  - '@next/eslint-plugin-next@16.3.3'
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'
  - next@16.3.3

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - "@sentry/cli"
  - supabase

overrides:
  zod: 4.3.6
  '@markdoc/markdoc': 0.5.8
