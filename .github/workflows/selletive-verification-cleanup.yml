name: Clean Selletive deployment verification

on:
  push:
    branches: [deploy/selletive-cloudflare]
    paths: [.github/workflows/selletive-verification-cleanup.yml]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Remove only the temporary Selletive contact verification
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const project = 'cnagsmkfjkxyxlefrkhu';
          async function api(path, query) {
            const response = await fetch(`https://api.supabase.com/v1/projects/${project}${path}`, {
              method: query ? 'POST' : 'GET',
              headers: {
                Authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`,
                'Content-Type': 'application/json',
              },
              body: query ? JSON.stringify({ query }) : undefined,
              signal: AbortSignal.timeout(30000),
            });
            assert(response.ok, `Supabase HTTP ${response.status}`);
            return response.json();
          }
          const destination = await api('');
          assert.equal(destination.id, project);
          assert.equal(destination.organization_id, 'kkqpanpyzsijqhbrlqnk');
          assert.equal(destination.name.toLowerCase(), 'selletive');
          const where = "email = 'deploy-check-20261016@example.invalid' and name = 'Selletive deployment verification' and message = 'Temporary deployment verification 20261016. This record will be removed after checking persistence.'";
          const removed = await api('/database/query', `delete from public.contact_messages where ${where} returning id;`);
          console.log(`Removed ${removed.length} deployment verification record(s).`);
          const [check] = await api('/database/query', `select count(*)::int as remaining from public.contact_messages where ${where};`);
          assert.equal(check.remaining, 0);
          JS
