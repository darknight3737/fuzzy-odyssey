name: Selletive Database Verification
on:
  push:
    branches:
      [
        deploy/selletive-cloudflare,
        codex/selletive-marketplace-complete,
        codex/selletive-onboarding,
        codex/selletive-onboarding-production,
        codex/selletive-onboarding-fix,
        codex/selletive-business-verification,
      ]
    paths:
      - '.github/workflows/selletive-database.yml'
      - '.github/scripts/verify-marketplace-browser.mjs'
      - 'apps/web/supabase/**'
      - 'apps/web/app/**/offerings/**'
      - 'apps/web/lib/offerings/**'
  workflow_dispatch:
    inputs:
      application:
        description: Verify application and browser flow against disposable database
        type: boolean
        default: false
      generate:
        description: Generate marketplace migration from declarative schema
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0
      - name: Start disposable database (CI only)
        working-directory: apps/web
        run: |
          supabase db diff --help
          supabase start -x studio,imgproxy,logflare,vector
      - name: Generate migration
        if: inputs.generate || hashFiles('apps/web/supabase/migrations/*marketplace.sql') == ''
        working-directory: apps/web
        run: |
          supabase db diff -f marketplace
          migration=$(find supabase/migrations -name '*marketplace.sql' -print -quit)
          # Migra reports pre-existing ACL drift; retain only intentional legacy revocations.
          sed -i -E '/^revoke (delete|insert|select|update) on table "public"\."(business_awards|business_cases|business_categories|business_locations|business_services|businesses|categories|category_aliases|locations|reviews|review_responses|verification_badges)" from "(anon|authenticated|service_role)";$/d' "$migration"
          grep -E '^(revoke|grant) ' supabase/schemas/22-marketplace.sql >> "$migration"
          sed -n "/^insert into storage.buckets(id,name,public,file_size_limit,allowed_mime_types)/,/^ on conflict(id).*;$/p" supabase/schemas/22-marketplace.sql >> "$migration"
          sed -n '/^with recursive primary_software_catalog as (/,$p' supabase/schemas/22-marketplace.sql >> "$migration"
          supabase db reset
          supabase test db
          supabase db diff > /tmp/schema-diff.sql
      - name: Apply migrations and prove isolation
        if: ${{ !inputs.generate && hashFiles('apps/web/supabase/migrations/*marketplace.sql') != '' }}
        working-directory: apps/web
        run: |
          supabase db reset
          supabase test db
          node ../../.github/scripts/verify-business-analytics-concurrency.mjs
          supabase db diff > /tmp/schema-diff.sql
          if grep -E 'business_analytics|record_business_interest' /tmp/schema-diff.sql; then exit 1; fi
      - name: Generate types
        if: always()
        working-directory: apps/web
        run: supabase gen types typescript --local --schema public > /tmp/database.types.ts
      - uses: pnpm/action-setup@v6
        if: inputs.application || (startsWith(github.ref_name, 'codex/selletive-onboarding') || github.ref_name == 'codex/selletive-business-verification')
      - name: Install application dependencies
        if: inputs.application || (startsWith(github.ref_name, 'codex/selletive-onboarding') || github.ref_name == 'codex/selletive-business-verification')
        run: pnpm install --frozen-lockfile
      - name: Prepare isolated application environment
        if: inputs.application || (startsWith(github.ref_name, 'codex/selletive-onboarding') || github.ref_name == 'codex/selletive-business-verification')
        working-directory: apps/web
        run: |
          supabase status -o json > "$RUNNER_TEMP/analytics-supabase.json"
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const status = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/analytics-supabase.json`, 'utf8'));
          const values = {
            NEXT_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321',
            NEXT_PUBLIC_SUPABASE_PUBLIC_KEY: status.PUBLISHABLE_KEY || status.ANON_KEY,
            SUPABASE_SECRET_KEY: status.SECRET_KEY || status.SERVICE_ROLE_KEY,
            NEXT_PUBLIC_SITE_URL: 'http://localhost:3000',
            NEXT_PUBLIC_CI: 'true', NEXT_PUBLIC_DEFAULT_LOCALE: 'pt',
            NEXT_PUBLIC_ENABLE_PERSONAL_ACCOUNT_BILLING: 'false',
            NEXT_PUBLIC_ENABLE_TEAM_ACCOUNTS_BILLING: 'false',
            NEXT_TELEMETRY_DISABLED: '1',
          };
          if (!values.NEXT_PUBLIC_SUPABASE_PUBLIC_KEY || !values.SUPABASE_SECRET_KEY) throw new Error('Missing isolated keys');
          for (const [key, value] of Object.entries(values)) {
            if (key.includes('KEY')) console.log(`::add-mask::${value}`);
            appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          JS
      - name: Typecheck, lint and format
        if: inputs.application || (startsWith(github.ref_name, 'codex/selletive-onboarding') || github.ref_name == 'codex/selletive-business-verification')
        run: |
          cp /tmp/database.types.ts apps/web/lib/database.types.ts
          cp /tmp/database.types.ts packages/supabase/src/database.types.ts
          pnpm lint:fix
          pnpm format:fix
          git diff > /tmp/analytics-formatting.patch
          pnpm typecheck
          node .github/scripts/test-selletive-directory-seo.mjs
          node .github/scripts/test-selletive-business-analytics.mjs
      - name: Build application in CI
        if: inputs.application || (startsWith(github.ref_name, 'codex/selletive-onboarding') || github.ref_name == 'codex/selletive-business-verification')
        run: pnpm --filter web exec next build --webpack
      - name: Start application in CI only
        if: inputs.application || (startsWith(github.ref_name, 'codex/selletive-onboarding') || github.ref_name == 'codex/selletive-business-verification')
        run: pnpm --filter web exec next start --port 3000 > /tmp/analytics-next.log 2>&1 &
      - name: Verify browser flow against disposable database
        if: inputs.application || (startsWith(github.ref_name, 'codex/selletive-onboarding') || github.ref_name == 'codex/selletive-business-verification')
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/api/healthcheck > /dev/null; then break; fi
            sleep 1
          done
          node .github/scripts/verify-business-analytics-browser.mjs
          SELLETIVE_BROWSER_CHANNEL=chrome SELLETIVE_TEST_SITE=http://localhost:3000 SELLETIVE_DISPOSABLE_DB=true node .github/scripts/verify-marketplace-browser.mjs
      - name: Validate Cloudflare build without deployment
        if: inputs.application || (startsWith(github.ref_name, 'codex/selletive-onboarding') || github.ref_name == 'codex/selletive-business-verification')
        run: |
          mkdir -p apps/web/.wrangler
          pnpm --filter web cloudflare:typegen
          pnpm --filter web cloudflare:build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selletive-database
          path: |
            apps/web/supabase/migrations/*marketplace.sql
            /tmp/database.types.ts
            /tmp/schema-diff.sql
            /tmp/analytics-formatting.patch
            /tmp/analytics-next.log
            ${{ runner.temp }}/selletive-marketplace/
