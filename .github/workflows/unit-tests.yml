name: Unit Tests

# Manual only — this workflow never runs on push or pull_request.
# Trigger it from Actions → Unit Tests → Run workflow.
on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system to run the tests on'
        type: choice
        required: true
        default: 'ubuntu-latest'
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - all
      filter:
        description: 'Optional pnpm/turbo filter (e.g. @kit/mcp-server). Empty runs every package.'
        type: string
        required: false
        default: ''

jobs:
  resolve-runners:
    name: Resolve runners
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.pick.outputs.runners }}
    steps:
      - id: pick
        run: |
          if [ "${{ inputs.os }}" = "all" ]; then
            echo 'runners=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'runners=["${{ inputs.os }}"]' >> "$GITHUB_OUTPUT"
          fi

  unit:
    name: ⚗️ Unit (${{ matrix.os }})
    needs: resolve-runners
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.resolve-runners.outputs.runners) }}

    env:
      DO_NOT_TRACK: 1

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests
        shell: bash
        run: |
          if [ -n "${{ inputs.filter }}" ]; then
            pnpm run test:unit --filter "${{ inputs.filter }}"
          else
            pnpm run test:unit
          fi
