name: Workflow
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, v2]
jobs:
  typescript:
    name: ʦ TypeScript
    timeout-minutes: 10
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_WEBHOOK_SECRET: ${{ secrets.SUPABASE_DB_WEBHOOK_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      DO_NOT_TRACK: 1
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

  test:
    name: ⚫️ Test
    timeout-minutes: 20
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    if: ${{ vars.ENABLE_E2E_JOB == 'true' }}
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_WEBHOOK_SECRET: ${{ secrets.SUPABASE_DB_WEBHOOK_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      ENABLE_BILLING_TESTS: ${{ vars.ENABLE_BILLING_TESTS }}
      DO_NOT_TRACK: 1
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Store Playwright's Version
        run: |
          PLAYWRIGHT_VERSION=$(pnpm ls @playwright/test --filter web-e2e | grep @playwright | sed 's/.*@//')
          echo "Playwright's Version: $PLAYWRIGHT_VERSION"
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

      - name: Cache Playwright Browsers for Playwright's Version
        id: cache-playwright-browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers
        if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: pnpm exec ./apps/e2e/node_modules/.bin/playwright install --with-deps

      - name: Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - name: Supabase Server
        run: pnpm run supabase:web:start:ci

      - name: Stripe CLI
        run: |
          docker run --add-host=host.docker.internal:host-gateway --name=stripe -d stripe/stripe-cli:v1.51.1 listen --all-snapshot --forward-to http://host.docker.internal:3000/api/billing/webhook --skip-verify --api-key "$STRIPE_SECRET_KEY" --log-level debug

          # fail fast if the webhook forwarder never becomes ready
          for i in $(seq 1 30); do
            if docker logs stripe 2>&1 | grep -q "Ready!"; then exit 0; fi
            sleep 1
          done

          docker logs stripe
          exit 1

      - name: Run Next.js Production Build (test env)
        run: pnpm --filter web build:test

      - name: Run Next.js Server
        run: pnpm --filter web start:test > next-server.log 2>&1 &

      - name: Run Playwright tests
        run: |
          echo "Running Playwright tests. Billing tests enabled: $ENABLE_BILLING_TESTS"
          pnpm run test

      - name: Run Supabase tests
        run: pnpm --filter web supabase:test

      - name: Print Stripe CLI and Next.js server logs
        if: always()
        run: |
          echo "::group::Stripe CLI image"
          docker image inspect stripe/stripe-cli:v1.51.1 --format '{{.Id}} {{.Created}}' || true
          echo "::endgroup::"
          echo "::group::Stripe CLI logs"
          docker logs stripe || true
          echo "::endgroup::"
          echo "::group::Next.js server logs"
          cat next-server.log || true
          echo "::endgroup::"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
