name: Selletive Preview

on:
  push:
    branches: [deploy/selletive-cloudflare]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selletive-cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '197b766a23439aced586d68ea5ec5463'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SELLETIVE_DEPLOYMENT_STAGE: preview
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - name: Verify Selletive destinations and prepare database
        run: node .github/scripts/selletive-deploy.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build Cloudflare preview
        run: pnpm --filter web cloudflare:build
      - name: Deploy Selletive preview
        run: pnpm --filter web cloudflare:deploy
      - name: Configure Selletive runtime secrets
        working-directory: apps/web
        run: pnpm exec wrangler secret bulk "$RUNNER_TEMP/selletive-worker-secrets.json"
      - name: Verify remote preview
        run: |
          curl --fail --retry 3 --retry-delay 5 -sS -o /dev/null https://selletive.frd-monteiro97.workers.dev/
          printf '%s\n' 'Preview: https://selletive.frd-monteiro97.workers.dev' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/selletive-worker-secrets.json"
