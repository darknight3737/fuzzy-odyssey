name: Selletive Preview

on:
  push:
    branches: [deploy/selletive-cloudflare]
  workflow_dispatch:
    inputs:
      application_only:
        description: 'Preserve existing Worker secrets; require unchanged verified database migrations'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: selletive-cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '197b766a23439aced586d68ea5ec5463'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SELLETIVE_DEPLOYMENT_STAGE: preview
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      SELLETIVE_APPLICATION_ONLY: ${{ inputs.application_only && 'true' || 'false' }}
      SELLETIVE_PUBLIC_KEY: ${{ vars.SELLETIVE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - name: Verify Selletive destinations and prepare database
        run: node .github/scripts/selletive-deploy.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: |
          pnpm lint:fix
          pnpm format:fix
          git diff > "$RUNNER_TEMP/selletive-formatting.patch"
      - name: Typecheck
        run: pnpm typecheck
      - name: Verify cache bootstrap and eviction
        run: |
          node .github/scripts/test-selletive-cache.mjs
          node .github/scripts/test-selletive-module-loading.mjs
          node .github/scripts/test-selletive-use-cache.mjs
      - name: Validate canonical Makerkit static-rendering assertions
        run: pnpm --filter web exec next build --webpack
      - name: Build Cloudflare preview
        run: pnpm --filter web cloudflare:build
      - name: Prepare prerender cache assets
        run: node .github/scripts/prepare-selletive-cache.mjs
      - name: Prepare Selletive cache infrastructure
        run: node .github/scripts/selletive-deploy.mjs infrastructure
      - name: Deploy Selletive preview
        working-directory: apps/web
        env:
          # Use on-demand runtime caching; avoid bulk KV writes on the free plan.
          OPEN_NEXT_DEPLOY: 'true'
        run: |
          pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/selletive-worker-bundle"
          node ../../.github/scripts/verify-selletive-worker-bundle.mjs "$RUNNER_TEMP/selletive-worker-bundle"
          if [ -f "$RUNNER_TEMP/selletive-worker-secrets.json" ]; then
            pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/selletive-worker-secrets.json"
          else
            pnpm exec wrangler deploy
          fi
      - name: Install preview test browser
        run: pnpm --filter web-e2e exec playwright install --with-deps chromium
      - name: Verify remote preview
        run: node .github/scripts/verify-selletive-preview.mjs
      - name: Upload homepage review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selletive-homepage-review
          path: |
            ${{ runner.temp }}/selletive-homepage/
            ${{ runner.temp }}/selletive-formatting.patch
      - name: Remove temporary secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/selletive-worker-secrets.json"
